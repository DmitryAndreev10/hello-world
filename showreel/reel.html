<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Claude — Motion Reel 2026</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; position: absolute; inset: 0; margin: auto; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ─────────────────────────────────────────────────────────────────────────────
//  CLAUDE — MOTION REEL 2026
//  15 s · 1920×1080 · 60 fps · 128 BPM — eight scenes, one per bar.
//  Everything is a pure function of time, so any frame renders exactly.
// ─────────────────────────────────────────────────────────────────────────────
const W = 1920, H = 1080, FPS = 60, DUR = 15;
const BPM = 128, B = 60 / BPM, BAR = B * 4;           // 0.46875 s / 1.875 s
const C = {
  ink: '#0A0A0F', paper: '#F3EFE6', orange: '#FF4A1C', blue: '#2F5BFF',
  lime: '#D7FF3C', pink: '#FF3D7F', violet: '#7B5CFF', gold: '#FFC23C',
};
const FONT = '"Inter Display", "Inter", sans-serif';
const MONO = '"DejaVu Sans Mono", monospace';
const TAU = Math.PI * 2;

const cv = document.getElementById('c'), out = cv.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const scene = mk(), sx = scene.getContext('2d');
const tmp = mk(), tx = tmp.getContext('2d');
const tmp2 = mk(), tx2 = tmp2.getContext('2d');

// ── math ────────────────────────────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, t) => clamp((t - a) / (b - a));
const E = {
  o3: x => 1 - Math.pow(1 - x, 3),
  o5: x => 1 - Math.pow(1 - x, 5),
  i3: x => x * x * x,
  io3: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  io5: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
  oExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  iExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  ioExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  oBack: (x, s = 1.70158) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
  oElastic: x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (TAU / 3)) + 1,
  oBounce: x => {
    const n = 7.5625, d = 2.75;
    if (x < 1 / d) return n * x * x;
    if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75;
    if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375;
    return n * (x -= 2.625 / d) * x + .984375;
  },
};
// damped spring, t in seconds
const spring = (t, w = 14, z = .35) => t <= 0 ? 0 : 1 - Math.exp(-z * w * t) * Math.cos(w * Math.sqrt(1 - z * z) * t);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgb = (c, k = 1, a = 1) => `rgba(${c[0] * k | 0},${c[1] * k | 0},${c[2] * k | 0},${a})`;
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

// ── drawing helpers ─────────────────────────────────────────────────────────
const bg = (c, col) => { c.fillStyle = col; c.fillRect(0, 0, W, H); };
const circ = (c, x, y, r) => { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); };
function rrect(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2)); }
function setFont(c, size, w = 900, font = FONT) { c.font = `${w} ${size}px ${font}`; }
// caps visually centred on y
function cap(c, s, x, y, size, w = 900, color = C.paper, { align = 'center', track = 0, font = FONT, stroke = 0 } = {}) {
  setFont(c, size, w, font); c.textAlign = align; c.textBaseline = 'alphabetic'; c.letterSpacing = track + 'px';
  if (stroke) { c.strokeStyle = color; c.lineWidth = stroke; c.strokeText(s, x, y + size * .364); }
  else { c.fillStyle = color; c.fillText(s, x, y + size * .364); }
  c.letterSpacing = '0px';
}
function mono(c, s, x, y, size = 16, color = C.paper, align = 'left', track = 2) {
  c.font = `500 ${size}px ${MONO}`; c.textAlign = align; c.textBaseline = 'middle'; c.letterSpacing = track + 'px';
  c.fillStyle = color; c.fillText(s, x, y); c.letterSpacing = '0px';
}
function layout(c, s, size, w = 900, track = 0, font = FONT) {
  setFont(c, size, w, font); c.letterSpacing = '0px';
  const ch = [...s], ws = ch.map(k => c.measureText(k).width);
  const total = ws.reduce((a, b) => a + b, 0) + track * (ch.length - 1);
  let x = -total / 2;
  return ch.map((k, i) => { const o = { ch: k, x: x + ws[i] / 2, w: ws[i] }; x += ws[i] + track; return o; });
}
const typed = (s, p) => s.slice(0, Math.floor(s.length * clamp(p)));
const FX = { glitch: 0 };

// ═════════════════════════════════════════════════════════════════════════════
//  SCENE 0 — INTRO: dot → line → split → name → iris
// ═════════════════════════════════════════════════════════════════════════════
function gridLines(c, g, a = .06) {
  c.strokeStyle = `rgba(243,239,230,${a})`; c.lineWidth = 1;
  c.beginPath();
  for (let x = 0; x <= W; x += 120) { c.moveTo(x + .5, 0); c.lineTo(x + .5, H * g); }
  for (let y = 0; y <= H; y += 120) { c.moveTo(0, y + .5); c.lineTo(W * g, y + .5); }
  c.stroke();
}
function s0(c, t) {
  bg(c, C.ink);
  gridLines(c, E.o3(inv(.1, 1.2, t)));
  const cx = W / 2, cy = H / 2;
  const push = 1 + .07 * E.io3(inv(.6, 1.875, t));
  c.save(); c.translate(cx, cy); c.scale(push, push);
  const pop = E.oElastic(inv(.02, .5, t));
  const stretch = E.oExpo(inv(.32, .78, t));
  const open = E.io5(inv(.6, 1.02, t));
  const lw = lerp(28, 1500, stretch), lh = lerp(28, 6, E.o5(inv(.32, .55, t)));
  c.fillStyle = C.orange;
  if (t < .32) { circ(c, 0, 0, 14 * pop); c.fill(); }
  else {
    const gap = open * 175;
    rrect(c, -lw / 2, -lh / 2 - gap, lw, lh, lh / 2); c.fill();
    if (gap > .5) {
      rrect(c, -lw / 2, -lh / 2 + gap, lw, lh, lh / 2); c.fill();
      c.save(); c.beginPath(); c.rect(-W, -gap + lh / 2, 2 * W, 2 * gap - lh); c.clip();
      const L = layout(c, 'CLAUDE', 290, 900, 8);
      L.forEach((o, i) => {
        const p = E.o5(inv(.64 + i * .035, 1.18 + i * .035, t));
        cap(c, o.ch, o.x, (1 - p) * 330, 290, 900, C.paper);
      });
      c.restore();
    }
  }
  const sub = inv(.92, 1.3, t);
  if (sub > 0) {
    c.globalAlpha = sub;
    cap(c, 'MOTION  DESIGN  REEL', 0, -250, 28, 600, C.paper, { track: lerp(44, 14, E.o5(sub)) });
    c.globalAlpha = 1;
    mono(c, typed('2026  /  60 FPS  /  1920×1080', inv(1.0, 1.35, t)), 0, 252, 18, 'rgba(243,239,230,.7)', 'center', 4);
  }
  c.restore();
  // iris out: paper ring leads, orange floods
  const r1 = 1250 * E.io3(inv(1.40, 1.80, t)), r2 = 1250 * E.io3(inv(1.48, 1.875, t));
  if (r1 > 0) { c.fillStyle = C.paper; circ(c, cx, cy, r1); c.fill(); }
  if (r2 > 0) { c.fillStyle = C.orange; circ(c, cx, cy, r2); c.fill(); }
}

// ═════════════════════════════════════════════════════════════════════════════
//  SCENE 1 — FORM: point-morphing shapes, squash & stretch, echoes
// ═════════════════════════════════════════════════════════════════════════════
const NP = 180, R = 190;
function polyPts(v) {
  const segs = []; let P = 0;
  for (let i = 0; i < v.length; i++) { const a = v[i], b = v[(i + 1) % v.length]; const len = Math.hypot(b[0] - a[0], b[1] - a[1]); segs.push({ a, b, len }); P += len; }
  const pts = []; let si = 0, acc = 0;
  for (let k = 0; k < NP; k++) {
    const d = k / NP * P;
    while (acc + segs[si].len < d) { acc += segs[si].len; si++; }
    const s = segs[si], u = (d - acc) / s.len;
    pts.push([lerp(s.a[0], s.b[0], u), lerp(s.a[1], s.b[1], u)]);
  }
  return pts;
}
const reg = (n, r, off = -Math.PI / 2) => Array.from({ length: n }, (_, i) => [Math.cos(off + i * TAU / n) * r, Math.sin(off + i * TAU / n) * r]);
const SH = [
  Array.from({ length: NP }, (_, k) => { const a = -Math.PI / 2 + k / NP * TAU; return [Math.cos(a) * R, Math.sin(a) * R]; }),
  polyPts(reg(4, R * 1.3)),
  polyPts(reg(3, R * 1.45)),
  polyPts(Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * TAU / 10, r = i % 2 ? R * .56 : R * 1.35; return [Math.cos(a) * r, Math.sin(a) * r]; })),
];
function shapeAt(t) {
  const k = Math.min(3, Math.floor(t / B)), p = t - k * B;
  let pts;
  if (k === 0) pts = SH[0];
  else { const m = E.oBack(inv(0, .26, p), 2.4); pts = SH[k - 1].map((a, i) => [lerp(a[0], SH[k][i][0], m), lerp(a[1], SH[k][i][1], m)]); }
  let rot = 0;
  for (let j = 1; j <= 3; j++) rot += Math.PI / 2 * E.oBack(inv(j * B, j * B + .32, t), 1.6);
  const sq = k === 0 ? 0 : Math.exp(-p * 9) * Math.sin(p * 40);
  const sc = k === 0 ? spring(t - .02, 15, .32) : 1;
  return { pts, rot, sx: (1 + .24 * sq) * sc, sy: (1 - .24 * sq) * sc };
}
function pathPts(c, pts) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); }
function s1(c, t) {
  bg(c, C.orange);
  const cx = W / 2, cy = H / 2;
  // pulse rings
  const ph = E.o3((t % B) / B);
  c.lineWidth = 2; c.strokeStyle = 'rgba(10,10,15,.16)';
  for (let i = 0; i < 14; i++) { circ(c, cx, cy, 110 + (i + ph) * 90); c.stroke(); }
  // giant outlined word drifting
  c.save(); c.globalAlpha = .55;
  cap(c, 'FORM', cx + lerp(90, -90, t / BAR), cy, 470, 900, C.ink, { stroke: 2.5, track: 24 });
  c.restore();
  const grow = E.iExpo(inv(3 * B + .1, BAR, t));
  // orbiters (back half)
  const orb = (front) => {
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * TAU + t * 1.7, z = Math.sin(a);
      if ((z > 0) !== front) continue;
      const x = cx + Math.cos(a) * 470, y = cy + z * 150 - Math.cos(a) * 60;
      const s = (14 + 8 * z) * (1 + .5 * Math.exp(-((t % B)) * 10)) * (1 - grow);
      c.fillStyle = i % 3 === 0 ? C.paper : C.ink;
      c.save(); c.translate(x, y); c.rotate(a * 2);
      if (i % 2) { c.fillRect(-s, -s, 2 * s, 2 * s); } else { circ(c, 0, 0, s); c.fill(); }
      c.restore();
    }
  };
  orb(false);
  // echoes
  for (let k = 6; k >= 1; k--) {
    const S = shapeAt(Math.max(0, t - k * .035));
    c.save(); c.translate(cx, cy); c.scale(S.sx, S.sy); c.rotate(S.rot);
    c.globalAlpha = .55 * (1 - k / 7) * (1 - grow);
    c.strokeStyle = C.paper; c.lineWidth = 3; pathPts(c, S.pts); c.stroke(); c.restore();
  }
  // main shape
  const S = shapeAt(t), g = 1 + grow * 15;
  c.save(); c.translate(cx, cy); c.scale(S.sx * g, S.sy * g); c.rotate(S.rot + grow * 1.2);
  c.fillStyle = C.ink; pathPts(c, S.pts); c.fill();
  const pulse = 16 + 14 * Math.exp(-(t % B) * 12);
  c.fillStyle = C.orange; circ(c, 0, 0, pulse * (S.sx > 0 ? 1 : 0) * (1 - grow)); c.fill();
  c.restore();
  orb(true);
}

// ═════════════════════════════════════════════════════════════════════════════
//  SCENE 2 — TYPE: slam, eased letters, rhythm, marquee
// ═════════════════════════════════════════════════════════════════════════════
function sliceExit(c, e, draw) {
  if (e <= 0) { draw(); return; }
  const o = E.iExpo(e) * 1600;
  c.save(); c.beginPath(); c.rect(0, 0, W, H / 2); c.clip(); c.translate(-o, 0); draw(); c.restore();
  c.save(); c.beginPath(); c.rect(0, H / 2, W, H / 2); c.clip(); c.translate(o, 0); draw(); c.restore();
}
function s2(c, t) {
  bg(c, C.ink);
  const cx = W / 2, cy = H / 2;
  const k = Math.min(3, Math.floor(t / B)), p = t - k * B;
  const ex = inv(B - .09, B, p);
  if (k === 0) {
    const sc = q => lerp(2.8, 1, E.oExpo(inv(0, .2, q)));
    // shockwave
    const sw = inv(.05, .34, p);
    if (sw > 0 && sw < 1) { c.strokeStyle = `rgba(255,74,28,${1 - sw})`; c.lineWidth = 40 * (1 - sw) + 2; circ(c, cx, cy, 200 + E.o3(sw) * 900); c.stroke(); }
    sliceExit(c, ex, () => {
      for (let g = 4; g >= 1; g--) {
        c.save(); c.globalAlpha = .12; c.translate(cx, cy); const s = sc(p - g * .022); c.scale(s, s);
        cap(c, 'TIMING', 0, 0, 290, 900, C.paper, { track: 6 }); c.restore();
      }
      c.save(); c.translate(cx, cy); const s = sc(p); c.scale(s, s);
      cap(c, 'TIMING', 0, 0, 290, 900, C.paper, { track: 6 }); c.restore();
      mono(c, `t = ${(p).toFixed(3)}s   ·   frame ${String(Math.floor((2 * BAR + p) * FPS)).padStart(4, '0')}`, cx, cy + 220, 20, C.orange, 'center', 4);
    });
  } else if (k === 1) {
    sliceExit(c, ex, () => {
      const L = layout(c, 'EASING', 290, 900, 6);
      L.forEach((o, i) => {
        const q = inv(i * .028, .24 + i * .028, p), e = E.oBack(q, 2.6);
        c.save(); c.globalAlpha = clamp(q * 4);
        c.translate(cx + o.x, cy - 40 + (1 - e) * 260); c.rotate((1 - e) * .5);
        cap(c, o.ch, 0, 0, 290, 900, C.lime); c.restore();
      });
      // live easing graph
      const gx = cx - 170, gy = cy + 260, gw = 340, gh = 100, q = inv(0, .36, p);
      c.strokeStyle = 'rgba(243,239,230,.25)'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(gx, gy - gh - 30); c.lineTo(gx, gy); c.lineTo(gx + gw, gy); c.stroke();
      c.strokeStyle = C.lime; c.lineWidth = 4; c.lineCap = 'round'; c.beginPath();
      for (let i = 0; i <= 60 * q; i++) { const u = i / 60; const X = gx + u * gw, Y = gy - E.oBack(u, 2.6) * gh; i ? c.lineTo(X, Y) : c.moveTo(X, Y); }
      c.stroke(); c.lineCap = 'butt';
      const hy = gy - E.oBack(q, 2.6) * gh; c.fillStyle = C.paper; circ(c, gx + q * gw, hy, 8); c.fill();
      mono(c, 'cubic-bezier(.34, 1.56, .64, 1)', gx + gw + 30, gy - gh / 2, 16, 'rgba(243,239,230,.6)', 'left', 2);
    });
  } else if (k === 2) {
    sliceExit(c, ex, () => {
      const L = layout(c, 'RHYTHM', 290, 900, 6), ent = E.oExpo(inv(0, .12, p));
      c.save(); c.translate(cx, cy - 30); c.scale(lerp(.6, 1, ent), lerp(.6, 1, ent)); c.globalAlpha = ent;
      L.forEach((o, i) => {
        const j = Math.abs(Math.sin((p / (B / 4)) * Math.PI + i * .55));
        cap(c, o.ch, o.x, -j * 70, 290, 900, i % 2 ? C.orange : C.paper);
      });
      c.restore();
      // equaliser
      for (let i = 0; i < 40; i++) {
        const h = 10 + 80 * Math.abs(Math.sin(p * 22 + i * .7) * Math.cos(p * 9 + i * .3));
        c.fillStyle = i % 8 === 3 ? C.orange : 'rgba(243,239,230,.5)';
        c.fillRect(cx - 40 * 13 + i * 26, cy + 300 - h, 14, h);
      }
    });
  } else {
    // marquee wall
    c.save(); c.translate(cx, cy); c.rotate(-.12);
    const rows = 11, rh = 132, str = 'MOTION • DESIGN • KINETIC • ';
    setFont(c, 112, 900); const tw = c.measureText(str).width;
    for (let i = 0; i < rows; i++) {
      const dir = i % 2 ? 1 : -1, y = (i - (rows - 1) / 2) * rh;
      const ent = (1 - E.oExpo(inv(i * .012, .2 + i * .012, p))) * -dir * 2600;
      const exi = E.iExpo(inv(B - .22 + Math.abs(i - 5) * .01, B, p)) * dir * 2600;
      let x0 = ((dir * p * 1100 + i * 237) % tw) - tw * 2 - W / 2 + ent + exi;
      const hero = i === 5;
      for (let x = x0; x < W * .8; x += tw) {
        if (hero) cap(c, str, x, y, 112, 900, C.orange, { align: 'left' });
        else cap(c, str, x, y, 112, 900, 'rgba(243,239,230,.55)', { align: 'left', stroke: 2 });
      }
    }
    c.restore();
  }
}

// ═════════════════════════════════════════════════════════════════════════════
//  SCENE 3 — PARTICLES: swirl → assemble → explode → warp
// ═════════════════════════════════════════════════════════════════════════════
const NPART = 4400; let PART = [];
const PBINS = [C.blue, C.violet, C.pink, C.orange, C.gold, C.lime].map(hex);
function initParticles() {
  const oc = mk(), o = oc.getContext('2d');
  cap(o, 'FLOW', W / 2, H / 2, 560, 900, '#fff', { track: 10 });
  const d = o.getImageData(0, 0, W, H).data, cand = [];
  for (let y = 0; y < H; y += 4) for (let x = 0; x < W; x += 4) if (d[(y * W + x) * 4 + 3] > 128) cand.push([x, y]);
  const r = rng(7);
  for (let i = cand.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [cand[i], cand[j]] = [cand[j], cand[i]]; }
  let minx = 1e9, maxx = -1e9; cand.forEach(p => { minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]); });
  PART = Array.from({ length: NPART }, (_, i) => {
    const [tx_, ty_] = cand[i % cand.length];
    const ea = Math.atan2(ty_ - H / 2, tx_ - W / 2) + (r() - .5) * 1.1;
    return {
      tx: tx_ + (r() - .5) * 2, ty: ty_ + (r() - .5) * 2, a0: r() * TAU, r0: 380 + r() * 900, sp: .7 + r() * 1.3,
      del: r() * .28, ea, ev: 500 + r() * 1600, ph: r() * TAU,
      bin: Math.min(5, Math.floor((tx_ - minx) / (maxx - minx + 1) * 6)),
    };
  });
}
function partPos(P, t) {
  const cx = W / 2, cy = H / 2;
  const a = P.a0 + t * P.sp * 1.6, r = P.r0 * (1 - .3 * clamp(t));
  const sx_ = cx + Math.cos(a) * r, sy_ = cy + Math.sin(a) * r * .58;
  const q = E.io3(inv(P.del, P.del + .55, t));
  let x = lerp(sx_, P.tx, q) + Math.sin(t * 5 + P.ph) * 2.5 * q;
  let y = lerp(sy_, P.ty, q) + Math.cos(t * 4 + P.ph) * 2.5 * q;
  const te = 2 * B;
  if (t > te) {
    const dt = t - te, dd = P.ev * (1 - Math.exp(-dt * 3.4)) / 3.4;
    const sw = dt * .6;
    x += Math.cos(P.ea + sw) * dd; y += Math.sin(P.ea + sw) * dd;
  }
  const w = E.iExpo(inv(1.38, BAR, t));
  if (w > 0) { const dx = x - cx, dy = y - cy; x += dx * w * 6; y += dy * w * 6; }
  return [x, y];
}
function s3(c, t) {
  bg(c, '#06060B');
  // dot field
  c.fillStyle = 'rgba(243,239,230,.07)';
  for (let y = 60; y < H; y += 60) for (let x = 60; x < W; x += 60) c.fillRect(x - 1, y - 1, 2, 2);
  // glow while assembled
  const gl = inv(.45, .7, t) * (1 - inv(2 * B, 2 * B + .12, t));
  if (gl > 0) {
    c.save(); c.globalAlpha = .22 * gl; c.shadowColor = C.pink; c.shadowBlur = 80;
    cap(c, 'FLOW', W / 2, H / 2, 560, 900, C.violet, { track: 10 }); c.restore();
  }
  c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';

  mono(c, `0${si} — ${NAMES[si]}`, 64, H - 58, 15, '#fff');
  const px = W - 64 - 360;
  c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(px, H - 59, 360, 2);
  c.fillStyle = '#fff'; c.fillRect(px, H - 60, 360 * T / DUR, 4);
  for (let i = 0; i <= 8; i++) c.fillRect(px + i * 45 - 1, H - 66, 2, 16);
  // crop marks
  c.fillStyle = '#fff';
  for (const [x, y, sx_, sy_] of [[36, 36, 1, 1], [W - 36, 36, -1, 1], [36, H - 36, 1, -1], [W - 36, H - 36, -1, -1]]) { c.fillRect(x, y, 28 * sx_, 2 * sy_); c.fillRect(x, y, 2 * sx_, 28 * sy_); }
  c.restore();
}
function render(f) {
  const T = Math.min(f / FPS, DUR - 1e-6);
  const si = Math.min(7, Math.floor(T / BAR)), lt = T - si * BAR;
  FX.glitch = 0;
  sx.setTransform(1, 0, 0, 1, 0, 0); sx.globalAlpha = 1; sx.globalCompositeOperation = 'source-over';
  SCENES[si](sx, lt);
  const k = Math.min(impactAt(T), 1.6);
  const dx = k * 20 * Math.sin(T * 97.3) * Math.sin(T * 13.1 + 1), dy = k * 20 * Math.cos(T * 83.1) * Math.sin(T * 17.7 + 2);
  const zs = 1 + k * .028;
  // stage camera into tmp2 (scene shake/zoom)
  tx2.setTransform(1, 0, 0, 1, 0, 0); tx2.fillStyle = '#000'; tx2.fillRect(0, 0, W, H);
  tx2.setTransform(zs, 0, 0, zs, W / 2 * (1 - zs) + dx, H / 2 * (1 - zs) + dy); tx2.drawImage(scene, 0, 0);
  tx2.setTransform(1, 0, 0, 1, 0, 0);
  const split = k * 9 + FX.glitch * 18;
  out.setTransform(1, 0, 0, 1, 0, 0); out.globalAlpha = 1; out.globalCompositeOperation = 'source-over';
  if (split > .8) rgbSplit(out, tmp2, split); else out.drawImage(tmp2, 0, 0);
  if (FX.glitch > 0) {
    tx.globalCompositeOperation = 'copy'; tx.drawImage(cv, 0, 0); tx.globalCompositeOperation = 'source-over';
    const r = rng(f * 31 + 5);
    for (let i = 0; i < 9; i++) { const y = r() * H, h = 8 + r() * 90, o = (r() - .5) * 260 * FX.glitch; out.drawImage(tmp, 0, y, W, h, o, y, W, h); }
  }
  hud(out, T, f);
  // vignette + grain
  out.fillStyle = VIG; out.fillRect(0, 0, W, H);
  out.globalCompositeOperation = 'overlay'; out.globalAlpha = .09;
  const g = GRAIN[f % GRAIN.length], r = rng(f * 7 + 1), ox = -r() * 512, oy = -r() * 512;
  for (let y = oy; y < H; y += 512) for (let x = ox; x < W; x += 512) out.drawImage(g, x, y);
  out.globalCompositeOperation = 'source-over'; out.globalAlpha = 1;
}

// ── boot ────────────────────────────────────────────────────────────────────
window.READY = (async () => {
  await Promise.all([document.fonts.load(`900 100px "Inter Display"`), document.fonts.load(`800 100px "Inter Display"`), document.fonts.load(`600 100px "Inter Display"`), document.fonts.load(`500 16px ${MONO}`)]);
  VIG = out.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  VIG.addColorStop(0, 'rgba(0,0,0,0)'); VIG.addColorStop(1, 'rgba(0,0,0,.5)');
  initParticles();
  return true;
})();
window.renderFrame = f => render(f);
window.TOTAL_FRAMES = DUR * FPS;

if (!new URLSearchParams(location.search).has('render')) {
  // live preview: plays in real time, loops; uses soundtrack if present
  const audio = new Audio('soundtrack.wav'); audio.loop = true;
  let t0 = null;
  window.READY.then(() => {
    const loop = now => { if (t0 === null) t0 = now; const T = ((now - t0) / 1000) % DUR; render(Math.floor(T * FPS)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    document.addEventListener('click', () => { t0 = null; audio.currentTime = 0; audio.play().catch(() => {}); });
  });
}
</script>
